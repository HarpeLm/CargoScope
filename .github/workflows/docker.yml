# Publishes the container images to ghcr.io/harpelm/cargoscope once a release
# is built, from the Linux binaries of that GitHub Release (nothing is
# recompiled). Run by hand with a tag to publish an existing release.
#
#   ghcr.io/harpelm/cargoscope:<version>, :latest           debian slim
#   ghcr.io/harpelm/cargoscope:<version>-full, :full        with cargo
name: Docker

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, such as v0.7.5
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
      IMAGE: ghcr.io/harpelm/cargoscope
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download the Linux binaries of the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Not a release tag: $TAG"; exit 1 ;;
          esac
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # A pre-release (1.0.0-rc.1) does not move :latest and :full.
          case "$VERSION" in *-*) echo "STABLE=false" >> "$GITHUB_ENV" ;; *) echo "STABLE=true" >> "$GITHUB_ENV" ;; esac
          mkdir -p downloads
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            gh release download "$TAG" --repo "$REPOSITORY" --dir downloads \
              --pattern "cargoscope-$target.tar.xz" --pattern "cargoscope-$target.tar.xz.sha256"
          done
          (cd downloads && for sum in *.sha256; do sha256sum --check "$sum"; done)
          for pair in amd64:x86_64-unknown-linux-gnu arm64:aarch64-unknown-linux-gnu; do
            arch="${pair%%:*}"; target="${pair#*:}"
            mkdir -p "docker/dist/$arch"
            tar -xJf "downloads/cargoscope-$target.tar.xz" -C downloads
            install -m 0755 "downloads/cargoscope-$target/cargoscope" "docker/dist/$arch/cargoscope"
          done

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push the slim image
        run: |
          tags="--tag $IMAGE:$VERSION"
          [ "$STABLE" = true ] && tags="$tags --tag $IMAGE:latest"
          # shellcheck disable=SC2086
          docker buildx build docker --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$VERSION" $tags --push

      - name: Build and push the full image
        run: |
          tags="--tag $IMAGE:$VERSION-full"
          [ "$STABLE" = true ] && tags="$tags --tag $IMAGE:full"
          # shellcheck disable=SC2086
          docker buildx build docker --platform linux/amd64,linux/arm64 \
            --build-arg BASE=rust:1-slim-bookworm --build-arg VERSION="$VERSION" $tags --push

      - name: Check the published images
        run: |
          docker run --rm "$IMAGE:$VERSION" --version | grep -Fx "cargoscope $VERSION"
          docker run --rm "$IMAGE:$VERSION-full" --version | grep -Fx "cargoscope $VERSION"
          docker run --rm --entrypoint cargo "$IMAGE:$VERSION-full" --version
