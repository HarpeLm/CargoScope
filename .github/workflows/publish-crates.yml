# Publishes the CargoScope crates to crates.io. Called by release.yml (dist)
# once the GitHub Release is built. Needs the CARGO_REGISTRY_TOKEN secret.
name: Publish crates

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-22.04
    # Pre-releases (v0.1.0-alpha.1) are not published to crates.io.
    if: ${{ !fromJson(inputs.plan).announcement_is_prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish the workspace crates in dependency order
        run: cargo publish --workspace --exclude cargoscope-corpus --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
