# Builds Python wheels that contain the cargoscope binary and publishes them
# to PyPI when a version tag is pushed. Uses PyPI trusted publishing: no
# token is stored, but the project must be registered on PyPI first (see
# docs/releasing.md).
name: PyPI

# PyPI publishing is not enabled yet: the workflow only runs by hand.
# To enable it, register the trusted publisher on PyPI (docs/releasing.md),
# then restore the trigger below.
#   push:
#     tags:
#       - "v[0-9]+.[0-9]+.[0-9]+"
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: Wheel (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, target: x86_64, manylinux: auto }
          - { runner: ubuntu-22.04, target: aarch64, manylinux: auto }
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { runner: macos-14, target: x86_64, manylinux: "" }
          - { runner: macos-14, target: aarch64, manylinux: "" }
          - { runner: windows-2022, target: x64, manylinux: "" }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist --manifest-path crates/cargoscope-cli/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.runner }}-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path crates/cargoscope-cli/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  publish:
    needs: [wheels, sdist]
    if: false # enable together with the tag trigger above
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
