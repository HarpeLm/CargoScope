# Runs the CargoScope GitHub Action from this repository against this
# repository. The `action` job downloads a published release on each OS, so it
# runs when a release is published, or by hand. The `pull-request` job builds
# CargoScope from the pull request and checks the comparison comment.
name: Action test

on:
  release:
    types: [published]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: CargoScope version to test ("latest" ignores pre-releases)
        default: latest
      security-pr:
        description: Also open a test security pull request from tests/fixtures/security-update
        type: boolean
        default: false
      updates-pr:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.updates-pr }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build CargoScope from this commit
        run: |
          cargo build --release --locked -p cargoscope
          echo "$PWD/target/release" >> "$GITHUB_PATH"
      - name: One pull request for every update
        id: grouped
        uses: ./
        with:
          version: installed
          path: tests/fixtures/updates
          fail-on: none
          upload-sarif: "false"
          updates: compatible
          updates-grouped: "true"
          updates-branch: cargoscope/updates-test
      - name: The [updates] groups of cargoscope.toml, labels, prefix and auto-merge
        id: per-package
        uses: ./
        with:
          version: installed
          path: tests/fixtures/updates
          fail-on: none
          upload-sarif: "false"
          updates: compatible
          updates-branch: cargoscope/updates-test
          labels: cargoscope-test
          commit-prefix: "chore(deps): "
          auto-merge: patch
      - name: Check the pull requests, then close them
        if: ${{ always() }}
        env:
          GROUPED: ${{ steps.grouped.outputs.pr-url }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          status=0
          prs=$(gh pr list --repo "$REPO" --state open --json number,headRefName,title,labels \
            --jq '.[] | select(.headRefName | startswith("cargoscope/updates-test")) | "\(.headRefName)|\(.title)|\([.labels[].name] | join(","))"' | sort)
          echo "$prs"
          test -n "$GROUPED" && gh pr view "$GROUPED" --repo "$REPO" --json state --jq .state | grep -qx CLOSED || status=1
          echo "$prs" | grep -qx 'cargoscope/updates-test-numbers|chore(deps): Bump the numbers group with 2 updates|cargoscope-test' || status=1
          echo "$prs" | grep -q '^cargoscope/updates-test-chrono|chore(deps): Bump chrono from 0.4.30 to 0.4.[0-9]*|cargoscope-test$' || status=1
          [ "$(echo "$prs" | grep -c .)" = 2 ] || status=1
          for number in $(gh pr list --repo "$REPO" --state open --json number,headRefName --jq '.[] | select(.headRefName | startswith("cargoscope/updates-test")) | .number'); do
            gh pr diff "$number" --repo "$REPO" | grep -q '^+version = "1.13' && { echo "regex was not ignored in #$number"; status=1; }
            gh pr close "$number" --repo "$REPO" --delete-branch --comment "Test pull request of the Action test." > /dev/null
          done
          gh label delete cargoscope-test --repo "$REPO" --yes > /dev/null 2>&1 || true
          exit "$status"
