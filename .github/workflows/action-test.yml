# Runs the CargoScope GitHub Action from this repository against this
# repository. The `action` job downloads a published release on each OS, so it
# runs when a release is published, or by hand. The `pull-request` job builds
# CargoScope from the pull request and checks the comparison comment.
name: Action test

on:
  release:
    types: [published]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: CargoScope version to test ("latest" ignores pre-releases)
        default: latest
      security-pr:
        description: Also open a test security pull request from tests/fixtures/security-update
        type: boolean
        default: false
      updates-pr:
        description: Also open test version update pull requests from tests/fixtures/security-update
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  action:
    if: ${{ github.event_name != 'pull_request' && !inputs.security-pr && !inputs.updates-pr }}
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: cargoscope
        uses: ./
        with:
          version: ${{ inputs.version || 'latest' }}
          fail-on: none
          upload-sarif: ${{ matrix.os == 'ubuntu-latest' }}
      - name: Check the outputs
        shell: bash
        run: |
          test -s "${{ steps.cargoscope.outputs.sarif }}"
          test "${{ steps.cargoscope.outputs.exit-code }}" = 0

  pull-request:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build CargoScope from this pull request
        run: |
          cargo build --release --locked -p cargoscope
          echo "$PWD/target/release" >> "$GITHUB_PATH"
      - id: cargoscope
        uses: ./
        with:
          version: installed
          fail-on: none
          upload-sarif: "false"
      - name: Check the outputs
        run: |
          test -s "${{ steps.cargoscope.outputs.sarif }}"
          test "${{ steps.cargoscope.outputs.exit-code }}" = 0
          grep -q "cargoscope-pr-comment" "$RUNNER_TEMP/cargoscope-comment.md"

  security-pr:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.security-pr }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build CargoScope from this commit
        run: |
          cargo build --release --locked -p cargoscope
          echo "$PWD/target/release" >> "$GITHUB_PATH"
      - name: One pull request for all updates
        id: grouped
        uses: ./
        with:
          version: installed
          path: tests/fixtures/security-update
          fail-on: none
          upload-sarif: "false"
          open-pr: "true"
          pr-branch: cargoscope/security-updates-test
          ci-workflow: ci.yml
      - name: One pull request per package, which closes the grouped one
        id: per-package
        uses: ./
        with:
          version: installed
          path: tests/fixtures/security-update
          fail-on: none
          upload-sarif: "false"
          open-pr: "true"
          pr-per-package: "true"
          pr-branch: cargoscope/security-updates-test
      - name: Check the pull requests
        env:
          GROUPED: ${{ steps.grouped.outputs.pr-url }}
          PER_PACKAGE: ${{ steps.per-package.outputs.pr-url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$GROUPED" && test -n "$PER_PACKAGE"
          gh pr view "$GROUPED" --json state --jq .state | grep -qx CLOSED
          gh pr view "$PER_PACKAGE" --json state,headRefName --jq '.state + " " + .headRefName' | grep -qx "OPEN cargoscope/security-updates-test-chrono"
          gh pr diff "$PER_PACKAGE" | grep -q '^+version = "0.4.20"'
      - name: Nothing left to update closes it
        uses: ./
        with:
          version: installed
          path: tests/fixtures/simple
          checks: inventory
          fail-on: none
          upload-sarif: "false"
          open-pr: "true"
          pr-branch: cargoscope/security-updates-test
      - name: Check that no test pull request is left open
        env:
          PER_PACKAGE: ${{ steps.per-package.outputs.pr-url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr view "$PER_PACKAGE" --json state --jq .state | grep -qx CLOSED
          test -z "$(gh pr list --state open --json headRefName --jq '.[].headRefName' | grep '^cargoscope/security-updates-test' || true)"

  updates-pr:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.updates-pr }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build CargoScope from this commit
        run: |
          cargo build --release --locked -p cargoscope
          echo "$PWD/target/release" >> "$GITHUB_PATH"
      - name: One pull request for every update
        id: grouped
        uses: ./
        with:
          version: installed
          path: tests/fixtures/updates
          fail-on: none
          upload-sarif: "false"
          updates: compatible
          updates-grouped: "true"
          updates-branch: cargoscope/updates-test
      - name: The [updates] groups of cargoscope.toml, labels and prefix
        id: per-package
        uses: ./
        with:
          version: installed
          path: tests/fixtures/updates
          fail-on: none
          upload-sarif: "false"
          updates: compatible
          updates-branch: cargoscope/updates-test
          labels: cargoscope-test
          commit-prefix: "chore(deps): "
          # Not auto-merge: this repository requires no checks, so GitHub
          # would merge the test pull requests at once (as it did with #12).
      - name: Check the pull requests, then close them
        if: ${{ always() }}
        env:
          GROUPED: ${{ steps.grouped.outputs.pr-url }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          status=0
          prs=$(gh pr list --repo "$REPO" --state open --json number,headRefName,title,labels \
            --jq '.[] | select(.headRefName | startswith("cargoscope/updates-test")) | "\(.headRefName)|\(.title)|\([.labels[].name] | join(","))"' | sort)
          echo "$prs"
          test -n "$GROUPED" && gh pr view "$GROUPED" --repo "$REPO" --json state --jq .state | grep -qx CLOSED || status=1
          echo "$prs" | grep -qx 'cargoscope/updates-test-numbers|chore(deps): Bump the numbers group with 2 updates|cargoscope-test' || status=1
          echo "$prs" | grep -q '^cargoscope/updates-test-chrono|chore(deps): Bump chrono from 0.4.30 to 0.4.[0-9]*|cargoscope-test$' || status=1
          [ "$(echo "$prs" | grep -c .)" = 2 ] || status=1
          for number in $(gh pr list --repo "$REPO" --state open --json number,headRefName --jq '.[] | select(.headRefName | startswith("cargoscope/updates-test")) | .number'); do
            gh pr diff "$number" --repo "$REPO" | grep -q '^+version = "1.13' && { echo "regex was not ignored in #$number"; status=1; }
            gh pr close "$number" --repo "$REPO" --delete-branch --comment "Test pull request of the Action test." > /dev/null
          done
          gh label delete cargoscope-test --repo "$REPO" --yes > /dev/null 2>&1 || true
          exit "$status"
