[package]
name = "depscout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/HarpeLm/DepScout#readme"
readme = "../../README.md"
# The end-to-end tests need fixtures from the repository root.
exclude = ["tests"]
description = "Understand every dependency in your Rust project: advisories, unused dependencies, licenses, versions and why each one is there"
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "depscout"
path = "src/main.rs"

[dependencies]
depscout-advisory = { path = "../depscout-advisory", version = "0.2.0-dev" }
depscout-cargo = { path = "../depscout-cargo", version = "0.2.0-dev" }
depscout-core = { path = "../depscout-core", version = "0.2.0-dev" }
depscout-report = { path = "../depscout-report", version = "0.2.0-dev" }
serde_json = "1"

[lints]
workspace = true

[dev-dependencies]
jsonschema = { version = "0.61", default-features = false }
