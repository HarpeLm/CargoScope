# CargoScope corpus for unused-dependency detection (SPEC.md section 5.2).
#
# Each repository is pinned to a commit. Labels were set by reading the code.
# `unused`: the dependency is really unused. `used`: CargoScope once reported it, wrongly.
# The development set was used to design the rules; the held-out set was
# labelled before any rule change, then one bug it revealed was fixed.
#
# Run: cargo run -p cargoscope-corpus -- <work-dir>

[[repository]]
name = "BurntSushi/ripgrep"
url = "https://github.com/BurntSushi/ripgrep"
commit = "178cc027e283fd965cb72d0a7395b219eada170c"
set = "development"
labels = [
  { manifest = "Cargo.toml", section = "dependencies", dependency = "lexopt", truth = "used", note = "used from crates/core, the [[bin]] path" },
  { manifest = "Cargo.toml", section = "dev-dependencies", dependency = "serde", truth = "used", note = "#[serde(...)] helper attributes in tests" },
]

