[package]
name = "unused-demo"
version = "0.1.0"
edition = "2021"

[dependencies]
serde_json = "1"                                  # used: plain path
anyhow = "1"                                      # used: only inside println!
tokio = { version = "1", features = ["macros"] }  # used: only as #[tokio::main]
json5x = { package = "json5", version = "0.4" }   # used: through its renamed key
unicode-width = "0.1"                             # used: as unicode_width
log = "0.4"                                       # unused: never mentioned
regex = "1"                                       # unused: only in a comment
rand = "0.8"                                      # unused: only in a string
openssl-sys = "0.9"                               # unused, but a -sys crate
chrono = { version = "0.4", optional = true }     # unused, but optional
idna = { version = "1", default-features = false } # unused, but also transitive
once_cell = "1"                                   # unused, ignored with a reason

[dev-dependencies]
tempfile = "3"                                    # used in tests/
pretty_assertions = "1"                           # unused

[build-dependencies]
cc = "1"                                          # used in build.rs
pkg-config = "0.3"                                # unused

[package.metadata.cargoscope]
ignore-unused = [
  { name = "once_cell", reason = "kept for an upcoming feature" },
]
