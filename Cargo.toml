[workspace]
members = [
    "crates/cargoscope-advisory",
    "crates/cargoscope-cargo",
    "crates/cargoscope-cli",
    "crates/cargoscope-core",
    "crates/cargoscope-corpus",
    "crates/cargoscope-report",
]
exclude = ["tests/fixtures"]
resolver = "2"

[workspace.package]
version = "0.2.0-dev"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/HarpeLm/CargoScope"
keywords = ["dependencies", "security", "cli"]
categories = ["command-line-utilities", "development-tools"]

[workspace.lints.rust]
unsafe_code = "forbid"

# The profile that dist builds release binaries with
[profile.dist]
inherits = "release"
lto = "thin"
