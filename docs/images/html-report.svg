  <rect x="204" y="108" width="78" height="22" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="243" y="123" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Licenses</text>

  <rect x="290" y="108" width="150" height="22" rx="6" fill="#161b22" stroke="#30363d"/>
