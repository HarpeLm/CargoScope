  <text x="82" y="163" fill="#f8fafc" font-family="'SFMono-Regular', Consolas, monospace" font-size="12" font-weight="700">chrono 0.4.19</text>
  <text x="182" y="163" fill="#4ade80" font-family="'SFMono-Regular', Consolas, monospace" font-size="12" font-weight="700">→ 0.4.20</text>
