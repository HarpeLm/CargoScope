<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="920" height="220" role="img" aria-label="CargoScope pipeline and workspace crate architecture">
  <defs>
    <linearGradient id="pipe-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b0f17"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="918" height="218" rx="16" fill="url(#pipe-bg)" stroke="#30363d" stroke-width="2"/>

  <!-- Stage boxes -->
  <!-- Stage 1 -->
  <rect x="36" y="22" width="192" height="96" rx="10" fill="#161b22" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1.5"/>
  <rect x="36" y="22" width="192" height="26" rx="10" fill="#38bdf8" fill-opacity="0.14"/>
  <text x="132" y="39" text-anchor="middle" fill="#38bdf8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700">1. Discover &amp; Parse</text>
  <text x="132" y="65" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12">Cargo.lock, Cargo.toml,</text>
  <text x="132" y="83" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12">deny.toml &amp; .rs tokens</text>
  <text x="132" y="103" text-anchor="middle" fill="#64748b" font-family="'SFMono-Regular', Consolas, monospace" font-size="11">read-only · zero exec</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="230" y1="70" x2="252" y2="70" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 2 -->
  <rect x="255" y="22" width="192" height="96" rx="10" fill="#161b22" stroke="#fb923c" stroke-opacity="0.60" stroke-width="1.5"/>
  <rect x="255" y="22" width="192" height="26" rx="10" fill="#f97316" fill-opacity="0.15"/>
  <text x="351" y="39" text-anchor="middle" fill="#fb923c" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700">2. Offline Analysis</text>
  <text x="351" y="65" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12">RustSec + relevance rank</text>
  <text x="351" y="83" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12">unused · licenses · bans</text>
  <text x="351" y="103" text-anchor="middle" fill="#64748b" font-family="'SFMono-Regular', Consolas, monospace" font-size="11">versions · weights · drift</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="449" y1="70" x2="471" y2="70" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 3 -->
  <rect x="474" y="22" width="192" height="96" rx="10" fill="#161b22" stroke="#a855f7" stroke-opacity="0.55" stroke-width="1.5"/>
  <rect x="474" y="22" width="192" height="26" rx="10" fill="#a855f7" fill-opacity="0.15"/>
  <text x="570" y="39" text-anchor="middle" fill="#c084fc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700">3. Reports &amp; SBOM</text>
  <text x="570" y="65" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12">HUD · JSON v1 · HTML</text>
  <text x="570" y="83" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12">SARIF 2.1.0 · CycloneDX 1.5</text>
  <text x="570" y="103" text-anchor="middle" fill="#64748b" font-family="'SFMono-Regular', Consolas, monospace" font-size="11">VEX not_affected · aggregate</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="668" y1="70" x2="690" y2="70" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 4 -->
  <rect x="692" y="22" width="192" height="96" rx="10" fill="#161b22" stroke="#22c55e" stroke-opacity="0.55" stroke-width="1.5"/>
  <rect x="692" y="22" width="192" height="26" rx="10" fill="#22c55e" fill-opacity="0.14"/>
  <text x="788" y="39" text-anchor="middle" fill="#4ade80" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700">4. Fixes &amp; CI Bot</text>
  <text x="788" y="65" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12">fix unused · --advisories</text>
  <text x="788" y="83" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12">fix --updates PRs · why</text>
  <text x="788" y="103" text-anchor="middle" fill="#64748b" font-family="'SFMono-Regular', Consolas, monospace" font-size="11">compare · /cargoscope bot</text>

  <!-- Workspace crate mapping row -->
  <text x="460" y="144" text-anchor="middle" fill="#64748b" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">WORKSPACE CRATES</text>

  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="600">
    <rect x="36" y="156" width="160" height="42" rx="8" fill="#111827" stroke="#30363d" stroke-width="1.2"/>
    <text x="116" y="174" text-anchor="middle" fill="#fb923c">cargoscope-cargo</text>
    <text x="116" y="190" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="400">manifests, lockfile, unused</text>

    <rect x="208" y="156" width="160" height="42" rx="8" fill="#111827" stroke="#30363d" stroke-width="1.2"/>
    <text x="288" y="174" text-anchor="middle" fill="#38bdf8">cargoscope-core</text>
    <text x="288" y="190" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="400">model, policy, tree weights</text>

    <rect x="380" y="156" width="160" height="42" rx="8" fill="#111827" stroke="#30363d" stroke-width="1.2"/>
    <text x="460" y="174" text-anchor="middle" fill="#f87171">cargoscope-advisory</text>
    <text x="460" y="190" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="400">RustSec, crates.io, cache</text>

    <rect x="552" y="156" width="160" height="42" rx="8" fill="#111827" stroke="#30363d" stroke-width="1.2"/>
    <text x="632" y="174" text-anchor="middle" fill="#c084fc">cargoscope-report</text>
    <text x="632" y="190" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="400">text, JSON, SARIF, HTML, VEX</text>

    <rect x="724" y="156" width="160" height="42" rx="8" fill="#111827" stroke="#30363d" stroke-width="1.2"/>
    <text x="804" y="174" text-anchor="middle" fill="#4ade80">cargoscope-cli</text>
    <text x="804" y="190" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="400">commands, fix, init, bot</text>
  </g>
</svg>
