<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 270" width="460" height="270" role="img" aria-label="CargoScope-Bot automated pull request preview">
  <defs>
    <linearGradient id="pr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b0f17"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="458" height="268" rx="14" fill="url(#pr-bg)" stroke="#30363d" stroke-width="1.8"/>

  <!-- PR Header -->
  <rect x="1" y="1" width="458" height="32" rx="14" fill="#161b22"/>
  <rect x="1" y="20" width="458" height="14" fill="#161b22"/>
  <line x1="1" y1="34" x2="459" y2="34" stroke="#30363d" stroke-width="1"/>
  <text x="18" y="21" fill="#fb923c" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">CargoScope-Bot</text>
  <text x="116" y="21" fill="#8b949e" font-family="'SFMono-Regular', Consolas, monospace" font-size="11">pull/42  ·  fix --updates / --advisories</text>

  <!-- Title + Open Badge -->
  <text x="20" y="60" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700">Bump serde from 1.0.219 to 1.0.228</text>
  <rect x="380" y="44" width="60" height="22" rx="11" fill="#238636"/>
  <text x="410" y="59" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">● Open</text>

  <!-- Needs Attention Callout -->
  <rect x="20" y="76" width="420" height="72" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <text x="32" y="96" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">Needs attention</text>
  <text x="32" y="116" fill="#4ade80" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">✔ MSRV 1.60 ≤ project 1.90</text>
  <text x="235" y="116" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">✔ License MIT OR Apache-2.0</text>
  <text x="32" y="136" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">✔ Advisories: 0 introduced</text>
  <text x="235" y="136" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">✔ 7d cooldown passed · auto-rebase</text>

  <!-- Cargo.lock diff & Release Notes -->
  <rect x="20" y="158" width="420" height="44" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <text x="32" y="177" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">Cargo.lock diff: 2 crates updated</text>
  <text x="255" y="177" fill="#58a6ff" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" text-decoration="underline">diff.rs</text>
  <text x="296" y="177" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">·</text>
  <text x="305" y="177" fill="#58a6ff" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" text-decoration="underline">Release notes</text>
  <text x="32" y="194" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Neutralised @mentions &amp; #issues · explains Cargo refusals</text>

  <!-- PR Comment Commands -->
  <text x="20" y="222" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="11">Comment commands:</text>
  <rect x="20" y="230" width="144" height="24" rx="6" fill="#161b22" stroke="#38bdf8" stroke-opacity="0.5"/>
  <text x="92" y="246" text-anchor="middle" fill="#38bdf8" font-family="'SFMono-Regular', Consolas, monospace" font-size="11">/cargoscope rebase</text>

  <rect x="172" y="230" width="212" height="24" rx="6" fill="#161b22" stroke="#fb923c" stroke-opacity="0.5"/>
  <text x="278" y="246" text-anchor="middle" fill="#fb923c" font-family="'SFMono-Regular', Consolas, monospace" font-size="11">/cargoscope ignore this version</text>
</svg>
