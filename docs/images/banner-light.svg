<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" width="920" height="240" role="img" aria-label="CargoScope — One offline report for your Cargo dependencies (light theme)">
  <defs>
    <linearGradient id="banner-light-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <radialGradient id="glow-light-orange" cx="12%" cy="34%" r="42%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-light-blue" cx="88%" cy="18%" r="45%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="banner-light-crate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Card frame -->
  <rect x="1" y="1" width="918" height="238" rx="16" fill="url(#banner-light-bg)" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="1" y="1" width="918" height="238" rx="16" fill="url(#glow-light-orange)"/>
  <rect x="1" y="1" width="918" height="238" rx="16" fill="url(#glow-light-blue)"/>

  <!-- Subtle right-hand dependency constellation -->
  <g stroke="#cbd5e1" stroke-width="1.4">
    <line x1="765" y1="36" x2="818" y2="54"/>
    <line x1="818" y1="54" x2="870" y2="34"/>
    <line x1="818" y1="54" x2="848" y2="96"/>
    <line x1="765" y1="36" x2="742" y2="86"/>
    <line x1="742" y1="86" x2="848" y2="96"/>
  </g>
  <circle cx="765" cy="36" r="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.8"/>
  <circle cx="818" cy="54" r="5" fill="#ffffff" stroke="#ea580c" stroke-width="1.8"/>
  <circle cx="870" cy="34" r="3.5" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
  <circle cx="848" cy="96" r="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.8"/>
  <circle cx="742" cy="86" r="3.5" fill="#ffffff" stroke="#64748b" stroke-width="1.8"/>

  <!-- CargoScope emblem -->
  <g transform="translate(36, 26)">
    <rect x="0" y="0" width="108" height="108" rx="24" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.8"/>
    <circle cx="54" cy="54" r="38" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.45"/>
    <circle cx="54" cy="54" r="28" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-dasharray="5 4" stroke-opacity="0.75"/>
    <line x1="54" y1="10" x2="54" y2="21" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="54" y1="87" x2="54" y2="98" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="10" y1="54" x2="21" y2="54" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="87" y1="54" x2="98" y2="54" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>
    <polygon points="54,32 73,43 73,65 54,76 35,65 35,43" fill="url(#banner-light-crate)" stroke="#fed7aa" stroke-width="1.3" stroke-linejoin="round"/>
    <polyline points="35.5,43.5 54,54 72.5,43.5" fill="none" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="54" y1="54" x2="54" y2="75" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="81" cy="81" r="12" fill="#22c55e" stroke="#0f172a" stroke-width="3"/>
    <polyline points="75.5,81.5 79.5,85.5 87,77.5" fill="none" stroke="#052e16" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title and subtitle -->
  <text x="168" y="68" fill="#ea580c" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">Cargo<tspan fill="#0f172a">Scope</tspan></text>

  <rect x="394" y="42" width="84" height="24" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/>
  <text x="436" y="58.5" text-anchor="middle" fill="#c2410c" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" font-weight="700">Rust CLI</text>

  <text x="168" y="96" fill="#334155" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="500">One offline report for your Rust/Cargo dependencies — why it's there, what it risks, and how to fix it.</text>

  <!-- Quick command strip -->
  <rect x="168" y="110" width="356" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="180" y="127" fill="#64748b" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5">$</text>
  <text x="194" y="127" fill="#38bdf8" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" font-weight="600">cargoscope</text>
  <text x="278" y="127" fill="#f8fafc" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5">scan . --update --fast</text>

  <rect x="536" y="110" width="166" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="552" cy="123" r="4" fill="#16a34a"/>
  <text x="564" y="127" fill="#334155" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">100% Rust · Zero Telemetry</text>

  <!-- Feature pills: row 1 -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">
    <rect x="36" y="154" width="272" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <circle cx="56" cy="170" r="8" fill="#fee2e2"/>
    <path d="M52.5,166.5 L59.5,173.5 M59.5,166.5 L52.5,173.5" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
    <text x="72" y="174.5" fill="#1e293b">Advisories + Relevance (VEX)</text>

    <rect x="324" y="154" width="272" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <circle cx="344" cy="170" r="8" fill="#dcfce7"/>
    <polyline points="340,170 343,173 348.5,166.5" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="360" y="174.5" fill="#1e293b">Static &amp; rustc Unused Deps</text>

    <rect x="612" y="154" width="272" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <circle cx="632" cy="170" r="8" fill="#f3e8ff"/>
    <polygon points="632,164.5 637.5,170 632,175.5 626.5,170" fill="none" stroke="#9333ea" stroke-width="1.8"/>
    <text x="648" y="174.5" fill="#1e293b">Licenses, Bans &amp; deny.toml</text>

    <!-- Feature pills: row 2 -->
    <rect x="36" y="194" width="272" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <circle cx="56" cy="210" r="8" fill="#e0f2fe"/>
    <path d="M56,214.5 L56,205.5 M52.5,209 L56,205.5 L59.5,209" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="72" y="214.5" fill="#1e293b">SemVer Updates &amp; Yanked</text>

    <rect x="324" y="194" width="272" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <circle cx="344" cy="210" r="8" fill="#fef3c7"/>
    <polygon points="344,205 349,210 344,215 339,210" fill="#d97706"/>
    <text x="360" y="214.5" fill="#1e293b">Maintenance Risks &amp; Chains</text>

    <rect x="612" y="194" width="272" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <circle cx="632" cy="210" r="8" fill="#ffedd5"/>
    <circle cx="632" cy="210" r="4" fill="none" stroke="#ea580c" stroke-width="2"/>
    <text x="648" y="214.5" fill="#1e293b">cargoscope fix &amp; PR Bot</text>
  </g>
</svg>
