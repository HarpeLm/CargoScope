app = "cargoscope-bot"
primary_region = "cdg"

[build]
  dockerfile = "deploy/github-app/Dockerfile"
  ignorefile = ".gitignore"

[env]
  CARGOSCOPE_APP_SLUG = "cargoscope-bot"
  CARGOSCOPE_BOT_LISTEN = "0.0.0.0:8080"
  CARGOSCOPE_BOT_WORK_DIR = "/data"
  CARGOSCOPE_BOT_STATE = "/data/state.json"
  CARGOSCOPE_BOT_POLL_SECS = "900"

[mounts]
  source = "cargoscope_bot_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/healthz"
  timeout = "5s"
