name: Dep Scout
description: Scan a Rust project with CargoScope - advisories, unused dependencies, licenses and versions, with SARIF for code scanning.
author: CargoScope contributors
branding:
  icon: search
  color: orange

inputs:
  version:
    description: CargoScope version to install, such as 0.1.0, or "latest". "installed" uses the cargoscope already on the PATH.
    default: latest
  path:
    description: Directory of the Cargo project to scan.
    default: "."
  fail-on:
    description: none, low, medium, high or critical. Empty means the CargoScope default (any vulnerability).
    default: ""
  checks:
    description: Comma-separated checks (inventory, advisories, unused, licenses, versions). Empty means all.
    default: ""
  sarif:
    description: Path of the SARIF file to write.
    default: cargoscope.sarif
  upload-sarif:
    description: "Upload the SARIF file to GitHub code scanning (needs `security-events: write`)."
    default: "true"
  comment:
    description: "On pull requests, post a comment with what the pull request changes: new and resolved advisories, unused dependencies, packages (needs `pull-requests: write`)."
    default: "true"
  new-only:
    description: "On pull requests, fail only on advisories that are not already on the base branch."
    default: "true"

outputs:
  sarif:
    description: Path of the SARIF file.
    value: ${{ inputs.sarif }}
  exit-code:
    description: "CargoScope exit code: 0 OK, 1 threshold reached, 2 execution error."
    value: ${{ steps.scan.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Install CargoScope
      if: ${{ inputs.version != 'installed' }}
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        # Prebuilt binary from the GitHub Release: no compilation.
        if [ "$VERSION" = "latest" ]; then
          base="https://github.com/HarpeLm/CargoScope/releases/latest/download"
        else
          base="https://github.com/HarpeLm/CargoScope/releases/download/v${VERSION#v}"
        fi
        if [ "$RUNNER_OS" = "Windows" ]; then
          powershell -NoProfile -ExecutionPolicy Bypass -Command "irm $base/cargoscope-installer.ps1 | iex"
        else
          curl --proto '=https' --tlsv1.2 -LsSf "$base/cargoscope-installer.sh" | sh
        fi
        echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"

    - name: Choose the data cache
      id: cache-key
      shell: bash
      run: |
        echo "CARGOSCOPE_CACHE_DIR=$RUNNER_TEMP/cargoscope-cache" >> "$GITHUB_ENV"
        # A new key every day, so advisories are refreshed daily at most.
        echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

    - name: Restore RustSec and crates.io data
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/cargoscope-cache
        key: cargoscope-data-${{ runner.os }}-${{ steps.cache-key.outputs.day }}
        restore-keys: cargoscope-data-${{ runner.os }}-

    - name: Download advisory and registry data
      shell: bash
      env:
        PROJECT: ${{ inputs.path }}
      run: cargoscope update "$PROJECT"

    - name: Scan the base branch of the pull request
      id: base
      if: ${{ github.event.pull_request && (inputs.comment == 'true' || inputs.new-only == 'true') }}
      shell: bash
      env:
        PROJECT: ${{ inputs.path }}
        CHECKS: ${{ inputs.checks }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        # The base commit, in a separate worktree; any failure only skips the
        # comparison.
        base="$RUNNER_TEMP/cargoscope-base"
        report="$RUNNER_TEMP/cargoscope-base.json"
        args=()
        [ -n "$CHECKS" ] && args+=(--checks "$CHECKS")
        if git fetch --quiet --no-tags --depth=1 origin "$BASE_SHA" \
          && git worktree add --quiet --detach "$base" "$BASE_SHA" \
          && cargoscope scan "$base/$PROJECT" "${args[@]}" --format json --fail-on none --output "$report"; then
          echo "report=$report" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::CargoScope could not scan the base branch ($BASE_SHA): no comparison for this pull request."
        fi

    - name: Scan
      id: scan
      shell: bash
      env:
        PROJECT: ${{ inputs.path }}
        FAIL_ON: ${{ inputs.fail-on }}
        CHECKS: ${{ inputs.checks }}
        SARIF: ${{ inputs.sarif }}
        BASELINE: ${{ inputs.new-only == 'true' && steps.base.outputs.report || '' }}
        CURRENT: ${{ steps.base.outputs.report && format('{0}/cargoscope-current.json', runner.temp) || '' }}
      run: |
        args=()
        [ -n "$FAIL_ON" ] && args+=(--fail-on "$FAIL_ON")
        [ -n "$CHECKS" ] && args+=(--checks "$CHECKS")
        # Readable report in the job log; never fails this step.
        cargoscope scan "$PROJECT" "${args[@]}" --fail-on none || true
        if [ -n "$CURRENT" ]; then
          cargoscope scan "$PROJECT" "${args[@]}" --format json --fail-on none --output "$CURRENT" \
            && echo "report=$CURRENT" >> "$GITHUB_OUTPUT"
        fi
        # Advisories already on the base branch do not fail a pull request.
        [ -n "$BASELINE" ] && args+=(--baseline "$BASELINE")
        set +e
        cargoscope scan "$PROJECT" "${args[@]}" --format sarif --output "$SARIF"
        code=$?
        set -e
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        if [ "$code" = 2 ]; then
          exit 2
        fi

    - name: Comment on the pull request
      if: ${{ inputs.comment == 'true' && steps.base.outputs.report && steps.scan.outputs.report }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
        PULL_REQUEST: ${{ github.event.pull_request.number }}
        BASE_REPORT: ${{ steps.base.outputs.report }}
        CURRENT_REPORT: ${{ steps.scan.outputs.report }}
      run: |
        body="$RUNNER_TEMP/cargoscope-comment.md"
        set +e
        cargoscope compare "$BASE_REPORT" "$CURRENT_REPORT" --format markdown --fail-on none > "$body"
        code=$?
        set -e
        if [ "$code" != 0 ]; then
          echo "::warning::This CargoScope version cannot write the pull request comment (compare --format markdown needs 0.2.0 or later)."
          exit 0
        fi
        cat "$body" >> "$GITHUB_STEP_SUMMARY"
        # Update the comment of an earlier run instead of adding a new one.
        marker="<!-- cargoscope-pr-comment -->"
        id=$(gh api --paginate "repos/$REPOSITORY/issues/$PULL_REQUEST/comments" \
          --jq ".[] | select(.body | startswith(\"$marker\")) | .id" 2>/dev/null | head -n 1) || true
        if [ -n "$id" ]; then
          gh api --silent -X PATCH "repos/$REPOSITORY/issues/comments/$id" -F "body=@$body" \
            || echo "::warning::CargoScope could not update its comment (the token needs pull-requests: write)."
        else
          gh api --silent "repos/$REPOSITORY/issues/$PULL_REQUEST/comments" -F "body=@$body" \
            || echo "::warning::CargoScope could not comment (the token needs pull-requests: write; pull requests from forks get a read-only token). The comparison is in the job summary."
        fi

    - name: Upload SARIF to code scanning
      if: ${{ inputs.upload-sarif == 'true' && steps.scan.outputs.exit-code != '2' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif }}
        category: cargoscope

    - name: Apply the failure threshold
      if: ${{ steps.scan.outputs.exit-code == '1' }}
      shell: bash
      run: |
        echo "::error::CargoScope found advisories at or above the threshold, or a policy violation."
        exit 1
