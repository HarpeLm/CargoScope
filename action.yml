name: CargoScope-Bot
description: Scan a Rust project with CargoScope - advisories, unused dependencies, licenses and versions, with SARIF for code scanning.
author: CargoScope contributors
branding:
  icon: search
  color: orange

inputs:
  version:
    description: CargoScope version to install, such as 0.1.0, or "latest". "installed" uses the cargoscope already on the PATH.
    default: latest
  path:
    description: Directory of the Cargo project to scan.
    default: "."
  fail-on:
    description: none, low, medium, high or critical. Empty means the CargoScope default (any vulnerability).
    default: ""
  checks:
    description: Comma-separated checks (inventory, advisories, unused, licenses, versions, policy). Empty means all.
    default: ""
  sarif:
    description: Path of the SARIF file to write.
    default: cargoscope.sarif
  upload-sarif:
    description: "Upload the SARIF file to GitHub code scanning (needs `security-events: write`; skipped if unavailable)."
    default: "true"
  comment:
    description: "On pull requests, post a comment with what the pull request changes: new and resolved advisories, unused dependencies, packages (needs `pull-requests: write`)."
    default: "true"
  new-only:
    description: "On pull requests, fail only on advisories that are not already on the base branch."
    default: "true"
  open-pr:
    description: "Outside pull requests (on a schedule, say), update vulnerable packages in Cargo.lock (and Cargo.toml when needed) with `cargoscope fix --advisories` and open or update a pull request (needs `contents: write` and `pull-requests: write`)."
    default: "false"
  pr-branch:
    description: Branch of the security update pull request (with pr-per-package, the prefix of one branch per package).
    default: cargoscope/security-updates
  pr-per-package:
    description: "With open-pr, one pull request per vulnerable package instead of one for all."
    default: "false"
  updates:
    description: "Outside pull requests (on a schedule, say), open or update pull requests that move direct dependencies to their newest version, as Dependabot version updates do: none, compatible (Cargo.lock only, within the requirements) or breaking (also newer major versions, raising the requirement in Cargo.toml). Needs `contents: write` and `pull-requests: write`."
    default: "none"
  updates-branch:
    description: Branch prefix of the version update pull requests (one branch per dependency, or the branch itself with updates-grouped).
    default: cargoscope/updates
  updates-grouped:
    description: "With updates, one pull request for every dependency instead of one per dependency (or per [updates] group of cargoscope.toml)."
    default: "false"
  labels:
    description: "Comma-separated labels for the security and update pull requests (created when missing), such as dependencies,rust."
    default: ""
  reviewers:
    description: "Comma-separated GitHub users or teams (org/team) asked to review the pull requests."
    default: ""
  commit-prefix:
    description: "Prefix of the pull request titles and commit messages, such as 'chore(deps): '."
    default: ""
  auto-merge:
    description: "none, patch or minor: enable auto-merge (squash) on version update pull requests of at most this update type, so they merge once the checks pass. The repository must allow auto-merge."
    default: "none"
  token:
    description: "Token used to push and open the pull request. The default token works when the repository allows GitHub Actions to create pull requests, but the pull request then starts no workflow; a personal access token or a GitHub App token starts them."
    default: ${{ github.token }}
  ci-workflow:
    description: "Workflow file to start on the pull request branch after an update, such as ci.yml (it needs a workflow_dispatch trigger). Lets checks run on the pull request with the default token."
    default: ""

outputs:
  sarif:
    description: Path of the SARIF file.
    value: ${{ inputs.sarif }}
  exit-code:
    description: "CargoScope exit code: 0 OK, 1 threshold reached, 2 execution error."
    value: ${{ steps.scan.outputs.exit-code }}
  pr-url:
    description: URL of the first pull request opened or updated (security first, then version updates).
    value: ${{ steps.security-pr.outputs.url }}

runs:
  using: composite
  steps:
    - name: Install CargoScope
      if: ${{ inputs.version != 'installed' }}
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        # Prebuilt binary from the GitHub Release: no compilation.
        if [ "$VERSION" = "latest" ]; then
          base="https://github.com/HarpeLm/CargoScope/releases/latest/download"
        else
          base="https://github.com/HarpeLm/CargoScope/releases/download/v${VERSION#v}"
        fi
        if [ "$RUNNER_OS" = "Windows" ]; then
          powershell -NoProfile -ExecutionPolicy Bypass -Command "irm $base/cargoscope-installer.ps1 | iex"
        else
          curl --proto '=https' --tlsv1.2 -LsSf "$base/cargoscope-installer.sh" | sh
        fi
        echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"

    - name: Choose the data cache
      id: cache-key
      shell: bash
      run: |
        echo "CARGOSCOPE_CACHE_DIR=$RUNNER_TEMP/cargoscope-cache" >> "$GITHUB_ENV"
        # A new key every day, so advisories are refreshed daily at most.
        echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

    - name: Restore RustSec and crates.io data
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/cargoscope-cache
        key: cargoscope-data-${{ runner.os }}-${{ steps.cache-key.outputs.day }}
        restore-keys: cargoscope-data-${{ runner.os }}-

    - name: Download advisory and registry data
      shell: bash
      env:
        PROJECT: ${{ inputs.path }}
        # Raises the GitHub API limit for the archived status of repositories.
        GITHUB_TOKEN: ${{ github.token }}
      run: cargoscope update "$PROJECT"

    - name: Scan the base branch of the pull request
      id: base
      if: ${{ github.event.pull_request && (inputs.comment == 'true' || inputs.new-only == 'true') }}
      shell: bash
      env:
        PROJECT: ${{ inputs.path }}
        CHECKS: ${{ inputs.checks }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        # The base commit, in a separate worktree; any failure only skips the
        # comparison.
        base="$RUNNER_TEMP/cargoscope-base"
        report="$RUNNER_TEMP/cargoscope-base.json"
        args=()
        [ -n "$CHECKS" ] && args+=(--checks "$CHECKS")
        if git fetch --quiet --no-tags --depth=1 origin "$BASE_SHA" \
          && git worktree add --quiet --detach "$base" "$BASE_SHA" \
          && cargoscope scan "$base/$PROJECT" "${args[@]}" --format json --fail-on none --output "$report"; then
          echo "report=$report" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::CargoScope could not scan the base branch ($BASE_SHA): no comparison for this pull request."
        fi

    - name: Scan
      id: scan
      shell: bash
      env:
        PROJECT: ${{ inputs.path }}
        FAIL_ON: ${{ inputs.fail-on }}
        CHECKS: ${{ inputs.checks }}
        SARIF: ${{ inputs.sarif }}
        BASELINE: ${{ inputs.new-only == 'true' && steps.base.outputs.report || '' }}
        CURRENT: ${{ steps.base.outputs.report && format('{0}/cargoscope-current.json', runner.temp) || '' }}
      run: |
        args=()
        [ -n "$FAIL_ON" ] && args+=(--fail-on "$FAIL_ON")
        [ -n "$CHECKS" ] && args+=(--checks "$CHECKS")
        # Readable report in the job log; never fails this step.
        cargoscope scan "$PROJECT" "${args[@]}" --fail-on none || true
        if [ -n "$CURRENT" ]; then
          cargoscope scan "$PROJECT" "${args[@]}" --format json --fail-on none --output "$CURRENT" \
            && echo "report=$CURRENT" >> "$GITHUB_OUTPUT"
        fi
        # Advisories already on the base branch do not fail a pull request.
        [ -n "$BASELINE" ] && args+=(--baseline "$BASELINE")
        set +e
        cargoscope scan "$PROJECT" "${args[@]}" --format sarif --output "$SARIF"
        code=$?
        set -e
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        if [ "$code" = 2 ]; then
          exit 2
        fi

    - name: Comment on the pull request
      if: ${{ inputs.comment == 'true' && steps.base.outputs.report && steps.scan.outputs.report }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
        PULL_REQUEST: ${{ github.event.pull_request.number }}
        BASE_REPORT: ${{ steps.base.outputs.report }}
        CURRENT_REPORT: ${{ steps.scan.outputs.report }}
      run: |
        body="$RUNNER_TEMP/cargoscope-comment.md"
        set +e
        cargoscope compare "$BASE_REPORT" "$CURRENT_REPORT" --format markdown --fail-on none > "$body"
        code=$?
        set -e
        if [ "$code" != 0 ]; then
          echo "::warning::This CargoScope version cannot write the pull request comment (compare --format markdown needs 0.2.0 or later)."
          exit 0
        fi
        cat "$body" >> "$GITHUB_STEP_SUMMARY"
        # Update the comment of an earlier run instead of adding a new one.
        marker="<!-- cargoscope-pr-comment -->"
        id=$(gh api --paginate "repos/$REPOSITORY/issues/$PULL_REQUEST/comments" \
          --jq ".[] | select(.body | startswith(\"$marker\")) | .id" 2>/dev/null | head -n 1) || true
        if [ -n "$id" ]; then
          gh api --silent -X PATCH "repos/$REPOSITORY/issues/comments/$id" -F "body=@$body" \
            || echo "::warning::CargoScope could not update its comment (the token needs pull-requests: write)."
        else
          gh api --silent "repos/$REPOSITORY/issues/$PULL_REQUEST/comments" -F "body=@$body" \
            || echo "::warning::CargoScope could not comment (the token needs pull-requests: write; pull requests from forks get a read-only token). The comparison is in the job summary."
        fi

    - name: Open, update or close the security and version update pull requests
      id: security-pr
      if: ${{ (inputs.open-pr == 'true' || inputs.updates != 'none') && !github.event.pull_request }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        TOKEN: ${{ inputs.token }}
        PROJECT: ${{ inputs.path }}
        SECURITY: ${{ inputs.open-pr }}
        BRANCH: ${{ inputs.pr-branch }}
        PER_PACKAGE: ${{ inputs.pr-per-package }}
        UPDATES: ${{ inputs.updates }}
        UPDATES_BRANCH: ${{ inputs.updates-branch }}
        UPDATES_GROUPED: ${{ inputs.updates-grouped }}
        LABELS: ${{ inputs.labels }}
        REVIEWERS: ${{ inputs.reviewers }}
        PREFIX: ${{ inputs.commit-prefix }}
        AUTO_MERGE: ${{ inputs.auto-merge }}
        BASE: ${{ github.ref_name }}
        CI_WORKFLOW: ${{ inputs.ci-workflow }}
        REPOSITORY: ${{ github.repository }}
      run: |
        case "$UPDATES" in
          none | compatible | breaking) ;;
          *) echo "::error::updates must be none, compatible or breaking, not '$UPDATES'."; exit 1 ;;
        esac
        case "$AUTO_MERGE" in
          none | patch | minor) ;;
          *) echo "::error::auto-merge must be none, patch or minor, not '$AUTO_MERGE'."; exit 1 ;;
        esac
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        kept=" "
        first_url=""

        # Labels, reviewers and auto-merge of pull request NUMBER, whose
        # largest update type is UPDATE_TYPE (empty for security updates).
        finish_pr() {
          number="$1"; update_type="$2"
          IFS=, read -ra labels <<< "$LABELS"
          for label in "${labels[@]}"; do
            label=$(echo "$label" | xargs)
            [ -n "$label" ] || continue
            gh pr edit "$number" --repo "$REPOSITORY" --add-label "$label" > /dev/null 2>&1 \
              || { gh label create "$label" --repo "$REPOSITORY" > /dev/null 2>&1; gh pr edit "$number" --repo "$REPOSITORY" --add-label "$label" > /dev/null; } \
              || echo "::warning::CargoScope could not add the label $label."
          done
          IFS=, read -ra reviewers <<< "$REVIEWERS"
          for reviewer in "${reviewers[@]}"; do
            reviewer=$(echo "$reviewer" | xargs)
            [ -n "$reviewer" ] || continue
            gh pr edit "$number" --repo "$REPOSITORY" --add-reviewer "$reviewer" > /dev/null \
              || echo "::warning::CargoScope could not ask $reviewer for a review."
          done
          allowed=0
          case "$AUTO_MERGE:$update_type" in
            patch:patch | minor:patch | minor:minor) allowed=1 ;;
          esac
          if [ "$allowed" = 1 ]; then
            gh pr merge "$number" --repo "$REPOSITORY" --auto --squash > /dev/null \
              && echo "Auto-merge enabled on #$number ($update_type update)." \
              || echo "::warning::CargoScope could not enable auto-merge on #$number: allow auto-merge in the repository settings."
          fi
        }

        # Opens or updates the pull request of BRANCH, from the commit the
        # workflow runs on: FIX is the cargoscope fix arguments (--advisories,
        # or --updates [--breaking]), UPDATE_TYPE the largest update type
        # (empty for security updates), then the packages to update (all
        # when none is given).
        open_pr() {
          branch="$1"; title="$PREFIX$2"; fix="$3"; update_type="$4"; shift 4
          body="$RUNNER_TEMP/cargoscope-pr.md"
          git checkout -q --detach --force "$GITHUB_SHA"
          only=()
          [ "$#" -gt 0 ] && only=(--only "$(IFS=,; echo "$*")")
          # shellcheck disable=SC2086
          cargoscope fix $fix "$PROJECT" --apply --format markdown "${only[@]}" > "$body" || return 0
          changed=$(git status --porcelain -- '*Cargo.lock' 'Cargo.lock' '*Cargo.toml' 'Cargo.toml' | awk '{print $2}' | sort -u)
          [ -n "$changed" ] || return 0
          git switch -q -C "$branch"
          # shellcheck disable=SC2086
          git add $changed
          git commit -q -m "$title (cargoscope fix $fix)"
          # The extra header actions/checkout leaves would replace the token.
          if ! git -c http.https://github.com/.extraheader= push -q --force \
            "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git" "HEAD:refs/heads/${branch}"; then
            echo "::error::CargoScope could not push ${branch}: the token needs contents: write."
            exit 1
          fi
          kept="$kept$branch "
          existing=$(gh pr list --repo "$REPOSITORY" --head "$branch" --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$REPOSITORY" --title "$title" --body-file "$body" > /dev/null
            url=$(gh pr view "$existing" --repo "$REPOSITORY" --json url --jq .url)
            echo "Updated the pull request: $url"
            finish_pr "$existing" "$update_type"
          elif url=$(gh pr create --repo "$REPOSITORY" --base "$BASE" --head "$branch" \
              --title "$title" --body-file "$body"); then
            echo "Opened the pull request: $url"
            finish_pr "${url##*/}" "$update_type"
          else
            echo "::error::CargoScope pushed ${branch} but could not open the pull request: give the job pull-requests: write, and allow GitHub Actions to create pull requests (Settings, Actions, General), or pass a personal access token or GitHub App token as token."
            exit 1
          fi
          [ -n "$first_url" ] || first_url="$url"
          if [ -n "$CI_WORKFLOW" ]; then
            # A workflow_dispatch started with the default token does run,
            # unlike pull request events; its checks show on the commit.
            gh workflow run "$CI_WORKFLOW" --repo "$REPOSITORY" --ref "$branch" \
              || echo "::warning::CargoScope could not start ${CI_WORKFLOW} on ${branch}: it needs a workflow_dispatch trigger, and the job actions: write."
          fi
        }

        # Closes the open pull requests of PREFIX that this run did not keep.
        close_obsolete() {
          prefix="$1"; why="$2"
          gh pr list --repo "$REPOSITORY" --state open --limit 200 --json number,headRefName \
            --jq '.[] | "\(.number) \(.headRefName)"' 2>/dev/null | while read -r number head; do
            case "$head" in
              "$prefix" | "$prefix"-*) ;;
              *) continue ;;
            esac
            case "$kept" in
              *" $head "*) continue ;;
            esac
            gh pr close "$number" --repo "$REPOSITORY" --delete-branch --comment "CargoScope: $why" > /dev/null \
              && echo "Closed the obsolete pull request #$number ($head)."
          done || true
        }

        if [ "$SECURITY" = "true" ]; then
          plan="$RUNNER_TEMP/cargoscope-security-plan.json"
          if cargoscope fix --advisories "$PROJECT" --format json > "$plan"; then
            packages=$(jq -r '.updates[].package' "$plan")
            if [ "$PER_PACKAGE" = "true" ]; then
              for package in $packages; do
                open_pr "$BRANCH-$package" "Security update for $package from CargoScope" "--advisories" "" "$package"
              done
            elif [ -n "$packages" ]; then
              # shellcheck disable=SC2086
              open_pr "$BRANCH" "Security updates from CargoScope" "--advisories" "" $packages
            fi
            [ -n "$packages" ] || echo "No vulnerable package can be updated."
            close_obsolete "$BRANCH" "nothing left to update in this pull request (the vulnerable version is gone from the base branch, it can no longer be updated, or the pull request mode changed)."
          else
            echo "::warning::CargoScope could not plan the security updates: no pull request opened or closed."
          fi
        fi

        if [ "$UPDATES" != "none" ]; then
          fix="--updates"
          [ "$UPDATES" = "breaking" ] && fix="--updates --breaking"
          git checkout -q --detach --force "$GITHUB_SHA"
          plan="$RUNNER_TEMP/cargoscope-updates-plan.json"
          # shellcheck disable=SC2086
          if cargoscope fix $fix "$PROJECT" --format json > "$plan"; then
            packages=$(jq -r '.updates[].package' "$plan" | sort -u)
            if [ "$UPDATES_GROUPED" = "true" ]; then
              if [ -n "$packages" ]; then
                largest=$(jq -r '[.pull_requests[].update_type] | if index("major") then "major" elif index("minor") then "minor" else "patch" end' "$plan")
                # shellcheck disable=SC2086
                open_pr "$UPDATES_BRANCH" "$(jq -r '.title' "$plan")" "$fix" "$largest" $packages
              fi
            else
              # Groups of [updates] first, then one per crate, within
              # open-pull-requests-limit: as planned by CargoScope.
              count=$(jq '.pull_requests | length' "$plan")
              for index in $(seq 0 $((count - 1))); do
                key=$(jq -r ".pull_requests[$index].key" "$plan")
                title=$(jq -r ".pull_requests[$index].title" "$plan")
                update_type=$(jq -r ".pull_requests[$index].update_type" "$plan")
                members=$(jq -r ".pull_requests[$index].packages[]" "$plan")
                # shellcheck disable=SC2086
                open_pr "$UPDATES_BRANCH-$key" "$title" "$fix" "$update_type" $members
              done
            fi
            [ -n "$packages" ] || echo "Every direct dependency is up to date."
            close_obsolete "$UPDATES_BRANCH" "this update is no longer needed (the dependency was updated on the base branch, or the update mode changed)."
          else
            echo "::warning::CargoScope could not plan the version updates: no pull request opened or closed."
          fi
        fi
        git checkout -q --detach --force "$GITHUB_SHA"
        echo "url=$first_url" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF to code scanning
      if: ${{ inputs.upload-sarif == 'true' && steps.scan.outputs.exit-code != '2' }}
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif }}
        category: cargoscope

    - name: Apply the failure threshold
      if: ${{ steps.scan.outputs.exit-code == '1' }}
      shell: bash
      run: |
        echo "::error::CargoScope found advisories at or above the threshold, or a policy violation."
        exit 1
